type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.MigrateToEventuateCommonCoordinationLeadership
displayName: Migrate to eventuate-common-coordination-leadership
description: Changes the packages, dependencies and BOM imports of eventuate-common's Leadership API modules to those of eventuate-common-coordination-leadership. The ZooKeeper package, io.eventuate.coordination.leadership.zookeeper, is unchanged.
recipeList:
  # Not recursive, so that io.eventuate.coordination.leadership.zookeeper is unchanged
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.eventuate.coordination.leadership
      newPackageName: io.eventuate.common.coordination.leadership
      recursive: false
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.eventuate.coordination.leadership.tests
      newPackageName: io.eventuate.common.coordination.leadership.tests
      recursive: false
  - org.openrewrite.text.FindAndReplace:
