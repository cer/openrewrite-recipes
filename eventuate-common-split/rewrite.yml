description: Changes the packages, dependencies and BOM imports of eventuate-common's Leadership API modules to those of eventuate-common-coordination-leadership. The ZooKeeper package, io.eventuate.coordination.leadership.zookeeper, is unchanged.
recipeList:
  # Not recursive, so that io.eventuate.coordination.leadership.zookeeper is unchanged
