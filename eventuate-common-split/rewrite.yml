---
type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.MigrateToEventuateCommonSplit
displayName: Migrate from eventuate-common to the repositories split from it
description: Changes the packages, dependencies and BOM imports of a consumer of eventuate-common to those of the repositories split from it.
recipeList:
  # First, because a FindAndReplace that changes a build.gradle turns it into plain text, which AddDependency cannot change
  - io.eventuate.common.split.AddEventuateCommonSplitDependencies
  - io.eventuate.common.split.MigrateToEventuateCommonId
  - io.eventuate.common.split.MigrateToEventuateCommonJson
  - io.eventuate.common.split.MigrateToEventuateCommonCoordinationLeadership
  - io.eventuate.common.split.MigrateToEventuateCommonTestcontainers
  - io.eventuate.common.split.MigrateToEventuateCommonZookeeper
  # After MigrateToEventuateCommonZookeeper, which adds EVENTUATE_COMMON_ZOOKEEPER_VERSION after the EVENTUATE_COMMON_VERSION line that this recipe replaces
  - io.eventuate.common.split.MigrateToEventuateCommonDatabase
  - io.eventuate.common.split.MigrateToEventuateCommonEventuateLocal
  # Last, because the recipes above add each new BOM import next to the eventuate-common-bom import
  - io.eventuate.common.split.RemoveEventuateCommonBomImport
---
type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.AddEventuateCommonSplitDependencies
displayName: Add the dependencies on the Testcontainers modules split from eventuate-common
description: Adds a dependency on the Testcontainers module of a repository split from eventuate-common to a module that uses one of its containers.
recipeList:
  # Scanned before the ChangeType rules change the type, so it matches the old type
  - org.openrewrite.gradle.AddDependency:
      groupId: io.eventuate.common.zookeeper
      artifactId: eventuate-common-zookeeper-testcontainers
      version: $eventuateCommonZookeeperVersion
      onlyIfUsing: io.eventuate.common.testcontainers.EventuateZookeeperContainer
  # The three patterns match the 16 database container classes and none of the base classes
  - org.openrewrite.gradle.AddDependency:
      groupId: io.eventuate.common.database
      artifactId: eventuate-common-database-testcontainers
      version: $eventuateCommonDatabaseVersion
      onlyIfUsing: io.eventuate.common.testcontainers.*Database*
  - org.openrewrite.gradle.AddDependency:
      groupId: io.eventuate.common.database
      artifactId: eventuate-common-database-testcontainers
      version: $eventuateCommonDatabaseVersion
      onlyIfUsing: io.eventuate.common.testcontainers.*SqlContainer
  - org.openrewrite.gradle.AddDependency:
      groupId: io.eventuate.common.database
      artifactId: eventuate-common-database-testcontainers
      version: $eventuateCommonDatabaseVersion
      onlyIfUsing: io.eventuate.common.testcontainers.*PostgresContainer
---
type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.MigrateToEventuateCommonId
displayName: Migrate to eventuate-common-id
description: Changes the packages, dependencies and BOM imports of eventuate-common's ID modules to those of eventuate-common-id.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.eventuate.common.spring.id
      newPackageName: io.eventuate.common.id.spring
      recursive: true
  - org.openrewrite.text.FindAndReplace:
      find: 'io\.eventuate\.common:(eventuate-common-id|eventuate-common-spring-id):\$\{?eventuateCommonVersion\}?'
      replace: 'io.eventuate.common.id:$1:\$eventuateCommonIdVersion'
      regex: true
      filePattern: '**/build.gradle'
  # Adds the BOM import after the eventuate-common-bom import, unless it is already there
  - org.openrewrite.text.FindAndReplace:
      find: '^([ \t]*)(\w+) platform\("io\.eventuate\.common:eventuate-common-bom:[^"]*"\)$(?![\s\S]*eventuate-common-id-bom)'
      replace: "$0\n$1$2 platform(\"io.eventuate.common.id:eventuate-common-id-bom:\\\${eventuateCommonIdVersion}\")"
      regex: true
      multiline: true
      filePattern: '**/build.gradle'
---
