type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.MigrateToEventuateCommonZookeeper
displayName: Migrate to eventuate-common-zookeeper
description: Changes the packages, dependencies, BOM imports and image versions of eventuate-common's ZooKeeper leadership module, ZooKeeper container and eventuate-zookeeper image to those of eventuate-common-zookeeper.
recipeList:
  # ChangeType rather than ChangePackage, because eventuate-messaging-kafka's own classes, such as KafkaLeaderSelector, are in io.eventuate.coordination.leadership.zookeeper
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.eventuate.coordination.leadership.zookeeper.ZkLeaderSelector
      newFullyQualifiedTypeName: io.eventuate.common.zookeeper.ZkLeaderSelector
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.eventuate.coordination.leadership.zookeeper.ZkLeadershipController
      newFullyQualifiedTypeName: io.eventuate.common.zookeeper.ZkLeadershipController
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.eventuate.common.testcontainers.EventuateZookeeperContainer
      newFullyQualifiedTypeName: io.eventuate.common.zookeeper.testcontainers.EventuateZookeeperContainer
  - org.openrewrite.text.FindAndReplace:
      find: 'io\.eventuate\.common:(eventuate-common-coordination-leadership-zookeeper):\$\{?eventuateCommonVersion\}?'
      replace: 'io.eventuate.common.zookeeper:$1:\$eventuateCommonZookeeperVersion'
      regex: true
      filePattern: '**/build.gradle'
  - org.openrewrite.text.FindAndReplace:
      find: 'eventuate-zookeeper:\$\{?EVENTUATE_COMMON_VERSION(\??)\}?'
      replace: 'eventuate-zookeeper:\$\{EVENTUATE_COMMON_ZOOKEEPER_VERSION$1\}'
      regex: true
      filePattern: '**/docker-compose*.yml'
  # Passes the ZooKeeper image version to Compose after EVENTUATE_COMMON_VERSION, unless it is already passed
  - org.openrewrite.text.FindAndReplace:
      find: '^([ \t]*)environment\.put "EVENTUATE_COMMON_VERSION", eventuateCommonImageVersion$(?![\s\S]*EVENTUATE_COMMON_ZOOKEEPER_VERSION)'
      replace: "$0\n$1environment.put \"EVENTUATE_COMMON_ZOOKEEPER_VERSION\", eventuateCommonZookeeperImageVersion"
      regex: true
      multiline: true
      filePattern: '**/build.gradle'
  # Adds the BOM import after the eventuate-common-bom import, unless it is already there
  - org.openrewrite.text.FindAndReplace:
      find: '^([ \t]*)(\w+) platform\("io\.eventuate\.common:eventuate-common-bom:[^"]*"\)$(?![\s\S]*eventuate-common-zookeeper-bom)'
      replace: "$0\n$1$2 platform(\"io.eventuate.common.zookeeper:eventuate-common-zookeeper-bom:\\\${eventuateCommonZookeeperVersion}\")"
      regex: true
      multiline: true
      filePattern: '**/build.gradle'
