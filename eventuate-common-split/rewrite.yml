type: specs.openrewrite.org/v1beta/recipe
name: io.eventuate.common.split.RemoveEventuateCommonBomImport
displayName: Remove the import of eventuate-common-bom
description: Removes the import of eventuate-common-bom, which the imports of the seven BOMs split from it replace.
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '^[ \t]*\w+ platform\("io\.eventuate\.common:eventuate-common-bom:[^"]*"\)\r?\n'
      replace: ''
      regex: true
      multiline: true
      filePattern: '**/build.gradle'
