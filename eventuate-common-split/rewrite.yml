      replace: 'io.eventuate.common.coordination.leadership:$1:\$eventuateCommonCoordinationLeadershipVersion'
      regex: true
      filePattern: '**/build.gradle'
  # Adds the BOM import after the eventuate-common-bom import, unless it is already there
  - org.openrewrite.text.FindAndReplace:
      find: '^([ \t]*)(\w+) platform\("io\.eventuate\.common:eventuate-common-bom:[^"]*"\)$(?![\s\S]*eventuate-common-coordination-leadership-bom)'
      replace: "$0\n$1$2 platform(\"io.eventuate.common.coordination.leadership:eventuate-common-coordination-leadership-bom:\\\${eventuateCommonCoordinationLeadershipVersion}\")"
      regex: true
      multiline: true
      filePattern: '**/build.gradle'
